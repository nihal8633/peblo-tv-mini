name: Peblo TV CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Python syntax check
        working-directory: backend
        run: python -m compileall -q app tests

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  cms:
    name: CMS lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - name: Install CMS dependencies
        working-directory: cms
        run: npm ci

      - name: Lint CMS
        working-directory: cms
        run: npm run lint

      - name: Build CMS
        working-directory: cms
        run: npm run build

  viewer:
    name: Viewer lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install Viewer dependencies
        working-directory: viewer
        run: npm ci

      - name: Lint Viewer
        working-directory: viewer
        run: npm run lint

      - name: Build Viewer
        working-directory: viewer
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, cms, viewer]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  deploy:
    name: Deployment placeholder
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Explain deployment step
        run: |
          echo "CI has successfully built and verified the application."
          echo "Production deployment would run here using environment-specific"
          echo "registry/cloud credentials stored as GitHub Actions secrets."